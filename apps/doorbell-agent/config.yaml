# Edge Agent Configuration
#
# This file configures the doorbell edge agent's connection to the
# centralized Policy API for scene tracking and decision making.

# Policy API Settings
policy_api:
  # URL of the centralized Policy API server
  # For local development: http://localhost:8000
  # For network deployment: http://policy-server.local:8000
  base_url: "http://localhost:8000"
  
  # Timeout for API calls (seconds)
  timeout: 5.0
  
  # Retry settings
  max_retries: 3
  retry_delay: 1.0

# Edge Agent Settings
agent:
  # Camera ID for this edge device
  # Must be unique across all edge devices
  camera_id: 1
  
  # Local database path (if using network share)
  # Comment out to use default: ../../data/doorbell.db
  # database_path: "/mnt/echoBell/doorbell.db"
  
  # Snapshot storage path
  snapshot_path: "../../data/sherriff.jpg"
  
  # Operating mode
  mode: "WORKING"  # or "MAINTENANCE", "TESTING"

# Fallback behavior when Policy API is unavailable
fallback:
  # If true, run scene tracking locally when API is down
  enable_local_tracking: false
  
  # If true, queue events and sync when API returns
  enable_event_queue: false
  
  # Log warning and continue without scene tracking
  warn_only: true
