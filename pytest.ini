[pytest]
# Pytest configuration for echoBell vision tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    
# Test paths
testpaths = tests

# Markers for organizing tests
markers =
    regression: Vision regression tests with known images
    integration: Integration tests requiring full system
    unit: Fast unit tests
    slow: Tests that take more than 1 second

# Minimum version
minversion = 6.0
